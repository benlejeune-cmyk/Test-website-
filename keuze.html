<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wat zullen we doen?</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body>

<div id="app">

    <section id="keuze">
        <div class="card">

            <h1>Wat zullen we doen?</h1>

            <p>
                Kies gerust meerdere dingen die je leuk lijken :)
            </p>

            <form id="keuzeForm">

                <label>
                    <input type="checkbox" name="activiteit" value="Museum in Antwerpen">
                    Museum in Antwerpen
                </label>

                <label>
                    <input type="checkbox" name="activiteit" value="Kringloopwinkelen">
                    Kringloopwinkelen
                </label>

                <label>
                    <input type="checkbox" name="activiteit" value="Lopen/sporten">
                    Lopen/sporten
                </label>

                <label>
                    <input type="checkbox" name="activiteit" value="Stille tijd">
                    Stille tijd
                </label>

                <label>
                    <input type="checkbox" name="activiteit" value="Knuffelen">
                    Knuffelen
                </label> <br>

                <label>
                    <input type="checkbox" name="activiteit" value="Koken">
                    Koken
                </label>

                <label>
                    <input type="checkbox" name="activiteit" value="Wandelen in Diepenbeek">
                    Wandelen in Diepenbeek
                </label>

                <label>
                    <input type="checkbox" name="activiteit" value="Ramen eten">
                    Ramen eten
                </label>

                <label>
                    <input type="checkbox" name="activiteit" value="Cinema">
                    Cinema
                </label>

                <label>
                    <input type="checkbox" name="activiteit" value="Dierentuin">
                    Dierentuin
                </label> <br> <br>

                <label for="eigenIdee">
                    Eigen idee:
                </label> 

                <input
                    type="text"
                    id="eigenIdee"
                    name="eigenIdee"
                    placeholder="Heb je zelf nog een idee?"
                > <br> <br>

                <button type="submit">
                    Bevestigen
                </button>

            </form>

        </div>
    </section>

</div>

<script src="script.js"></script>

</body>
</html>
