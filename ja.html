<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jippie Tessa wilt op date met mij</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body>

<div id="app">

    <section id="agenda">
        <div class="card">

            <h1>❤️JIPPPIEE❤️</h1>
            <h2>Wanneer spreken we af?</h2>

            <p>
                Kies maar een datum uit dat je kan en wilt :)
            </p>

            <img src="dancing-crazy.gif" alt="Beschrijving van de GIF">

            <form id="agendaForm">

                <label for="agendaDate">Datum</label>

                <input
                    id="agendaDate"
                    type="date"
                    required
                >

                <label for="agendaTime">Uur</label>

                <input
                    id="agendaTime"
                    type="time"
                    min="00:00"
                    max="23:59"
                    step="60"
                    required
                >

                <button type="submit" id="confirm-agenda">
                    Kies dit moment
                </button>

            </form>

            <a href="https://calendar.google.com/calendar/u/1?cid=YmVubGVqZXVuZTA0QGdtYWlsLmNvbQ">
                Ben's agenda raadplegen
            </a>

        </div>
    </section>

</div>

<script src="script.js"></script>

</body>
</html>
